services:
  - type: web
    name: neat-delhivery-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2024-10"
      - key: SHOPIFY_SYNC_START_DATE
        sync: false
      - key: ORDER_LOOKBACK_DAYS
        value: "30"
      - key: DELHIVERY_API_TOKEN
        sync: false
      - key: DELHIVERY_BASE_URL
        value: https://track.delhivery.com
      - key: DELHIVERY_ORDER_ID_PREFIX
        value: NEAT-
      - key: MONGODB_URI
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
      - key: NODE_VERSION
        value: "20"
